<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,500&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FFFFFF; --sans: 'Libre Franklin', sans-serif; }
  @media (max-width: 700px) {
    #site-nav { padding: 16px 20px !important; }
    #site-nav-links { gap: 14px !important; }
    #site-nav-links a { font-size: 9px !important; }
    #contact-list { grid-template-columns: 1fr !important; padding: 40px 20px !important; gap: 20px !important; }
    #contact-list h2 { font-size: 32px !important; }
    #contact-rows > div { flex-wrap: wrap !important; row-gap: 4px !important; padding: 18px 0 !important; }
    #phone-wrap, #location-wrap { display: flex !important; flex-direction: column !important; gap: 2px !important; }
    #phone-time, #location-remote { margin-left: 0 !important; }
    #contact-rows a, #contact-rows span[style*="font-size: 24px"] { font-size: 19px !important; }
    #contact-footer { padding: 28px 20px 40px !important; flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; }
  }
</style>
</helmet>

<div style="background: #FFFFFF; color: #111111; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Top bar -->
  <nav id="site-nav" style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 56px; border-bottom: 1px solid #E3E1DC;">
    <a href="index.html" style="font-family: 'EB Garamond', serif; font-size: 20px; color: #111111; text-decoration: none;">Justyna Koc</a>
    <div id="site-nav-links" style="display: flex; gap: 28px;">
      <a href="index.html" style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #767470; text-decoration: none; padding-bottom: 2px;" style-hover="color: #111111 !important;">Work</a>
      <a href="about.html" style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #767470; text-decoration: none; padding-bottom: 2px;" style-hover="color: #111111 !important;">About</a>
      <a href="Contact.dc.html" style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #111111; text-decoration: none; border-bottom: 1px solid #111111; padding-bottom: 2px;">Contact</a>
    </div>
  </nav>

  <!-- Contact list -->
  <section id="contact-list" data-screen-label="Contact list" style="display: grid; grid-template-columns: minmax(160px, 1fr) minmax(0, 2.2fr); gap: 48px; padding: 72px 56px; border-top: 1px solid #E3E1DC; flex: 1;">
    <div>
      <h2 style="font-family: 'EB Garamond', serif; font-weight: 400; font-size: 44px; line-height: 1.1; color: #111111; margin: 0;">Reach me</h2>
    </div>
    <div id="contact-rows" style="max-width: 640px;">
      <div style="display: flex; align-items: baseline; gap: 24px; padding: 22px 0; border-bottom: 1px solid #E3E1DC;">
        <span style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #767470; min-width: 110px; flex-shrink: 0;">Email</span>
        <a href="mailto:Justyna.koc@gmail.com" style="font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 24px; color: #111111; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px;" style-hover="border-bottom-color: #111111 !important;">Justyna.koc@gmail.com</a>
      </div>
      <div style="display: flex; align-items: baseline; gap: 24px; padding: 22px 0; border-bottom: 1px solid #E3E1DC;">
        <span style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #767470; min-width: 110px; flex-shrink: 0;">Phone</span>
        <span id="phone-wrap">
        <a href="tel:+48572261166" style="font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 24px; color: #111111; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px;" style-hover="border-bottom-color: #111111 !important;">+48 572 261 166</a>
        <span id="phone-time" style="font-family: var(--sans); font-size: 13px; font-weight: 500; color: #767470; margin-left: 16px;">{{ localTime }}</span>
        </span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 24px; padding: 22px 0; border-bottom: 1px solid #E3E1DC;">
        <span style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #767470; min-width: 110px; flex-shrink: 0;">LinkedIn</span>
        <a href="https://www.linkedin.com/in/justyna-koc/" target="_blank" style="font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 24px; color: #111111; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px;" style-hover="border-bottom-color: #111111 !important;">justyna-koc</a>
      </div>
      <div style="display: flex; align-items: baseline; gap: 24px; padding: 22px 0;">
        <span style="font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #767470; min-width: 110px; flex-shrink: 0;">Location</span>
        <span id="location-wrap">
        <span style="font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 24px; color: #111111;">EU, Warsaw, Poland</span>
        <span id="location-remote" style="font-family: var(--sans); font-size: 13px; font-weight: 500; color: #767470; margin-left: 16px;">Remote welcome</span>
        </span>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="contact-footer" style="display: flex; justify-content: space-between; align-items: baseline; padding: 40px 56px 56px; border-top: 1px solid #E3E1DC;">
    <span style="font-family: 'EB Garamond', serif; font-size: 18px; color: #111111;">Justyna Koc</span>
    <span style="font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #767470;">Warsaw, Poland · 2026</span>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { time: '' };
  updateTime() {
    const t = new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', hour12: false });
    this.setState({ time: t });
  }
  componentDidMount() {
    this.updateTime();
    this._timer = setInterval(() => this.updateTime(), 60000);
  }
  componentWillUnmount() { clearInterval(this._timer); }
  renderVals() {
    return { localTime: this.state.time ? 'Local time: ' + this.state.time : '' };
  }
}
</script>
</body>
</html>
